# Feature Flags Configuration as Code
#
# This file defines feature flags with per-environment initial enabled states.
#
# All feature flags are bootstrap-only (skip-if-exists in the import script):
# the first import sets the initial state; subsequent imports do not override
# the flag state in Azure App Configuration unless explicitly deleted first.
#
# Format:
# FlagName:
#   description: Human-readable description
#   shared:                    # OPTIONAL: initial state for all envs with no label
#     enabled: true|false
#   <environment-label>:       # Environment-specific initial state
#     enabled: true|false
#
# If no "shared" section is provided, the flag starts unset in all environments.
#
# Add your feature flags here:

ExampleFlag:
  description: "Example feature flag — rename or remove this"
  shared:
    enabled: false
  staging:
    enabled: true      # Always enabled in staging and PR slots
  production:
    enabled: false     # Disabled by default in production; enable via Azure Portal as needed
