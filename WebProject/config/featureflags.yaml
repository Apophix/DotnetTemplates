# Feature Flags — config as code
#
# Source of truth for feature flag definitions and per-environment initial states.
# Run gen-appsettings.cs to bake these into appsettings.{Env}.json for any environment.
#
# Flags apply to local dev (via appsettings.local.json) and all deployed environments.
# There is no Azure dependency — this file works the same whether or not you use
# Azure App Configuration.
#
# Format:
# FlagName:
#   description: Human-readable description
#   shared:                    # OPTIONAL: initial state for all envs with no label
#     enabled: true|false
#   <environment-label>:       # Environment-specific override
#     enabled: true|false
#
# Azure App Configuration (optional): the sync-appconfig.sh script imports these flags
# using skip-if-exists semantics — first import sets initial state; subsequent imports
# do not override flag state already managed in Azure Portal.
#
# Add your feature flags here:

ExampleFlag:
  description: "Example feature flag — rename or remove this"
  shared:
    enabled: false
  staging:
    enabled: true      # Always enabled in staging and PR slots
  production:
    enabled: false     # Disabled by default in production; enable via Azure Portal as needed
