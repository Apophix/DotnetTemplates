# AppConfig Configuration as Code
#
# This file defines application settings organized by environment label.
#
# Format:
# - "shared" section: settings with no label (applies to all environments unless overridden)
# - Environment labels (e.g., "staging", "production"): environment-specific overrides
#
# For Key Vault secrets:
#   - keyVaultSecret: <name> — REQUIRED: the secret name within the vault
#   - keyVaultName: <name> — OPTIONAL: explicit vault name override
#     (when absent, the import script resolves the vault by environment tag)

shared:
  # PostHog product analytics (opt-in). Set ProjectToken to enable.
  # Leave blank to run without PostHog — all analytics calls will be no-ops.
  # PostHog:ProjectToken: ""
  # PostHog:HostUrl: "https://us.i.posthog.com"  # EU: https://eu.i.posthog.com
  # Add settings that apply to all environments here.
  # Example:
  # App:SomeSetting: "shared value"

staging:
  # Add staging-specific overrides here.
  # Example:
  # App:SomeSetting: "staging value"
  # App:SomeSecret:
  #   keyVaultSecret: some-secret-name

production:
  # Add production-specific overrides here.
  # Example:
  # App:SomeSetting: "production value"
  # App:SomeSecret:
  #   keyVaultSecret: some-secret-name
