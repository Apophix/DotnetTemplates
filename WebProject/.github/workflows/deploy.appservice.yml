name: Deploy (App Service)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: WebProject.Web/package-lock.json

      - name: Restore
        run: |
          for attempt in 1 2 3; do
            dotnet restore WebProject.slnx && break
            [ $attempt -lt 3 ] && { echo "Attempt $attempt/3 failed — retrying in 15s..."; sleep 15; } || exit 1
          done

      - name: Test
        run: |
          dotnet test WebProject.slnx \
            --configuration Release \
            --no-restore \
            --filter "FullyQualifiedName!~Integration"

      - name: Generate appsettings.Production.json
        run: |
          dotnet run config/gen-appsettings.cs -- \
            --env production \
            --output WebProject.Api/appsettings.Production.json

      - name: Publish API
        run: |
          dotnet publish WebProject.Api/WebProject.Api.csproj \
            --configuration Release \
            --output publish/api \
            --no-restore

      - name: Publish migration service
        run: |
          dotnet publish WebProject.MigrationService/WebProject.MigrationService.csproj \
            --configuration Release \
            --output publish/migration \
            --no-restore

      - name: Build frontend
        working-directory: WebProject.Web
        env:
          VITE_API_BASE_URL: https://app-webprojectazureprefix-api.azurewebsites.net
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            [ $attempt -lt 3 ] && { echo "Attempt $attempt/3 failed — retrying in 15s..."; sleep 15; } || exit 1
          done
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: migration
          path: publish/migration

      - uses: actions/upload-artifact@v4
        with:
          name: web-prod
          path: WebProject.Web/dist/client

  migrate-prod:
    name: Migrate production database
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: migration
          path: ./migration

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run migrations against production database
        run: |
          az_retry() {
            local n=1 max=5 delay=15
            until "$@"; do
              (( n++ >= max )) && { echo "ERROR: command failed after $((max)) attempts: $*" >&2; return 1; }
              echo "Attempt $((n-1))/$((max-1)) failed — retrying in ${delay}s..."
              sleep $delay
            done
          }
          KV=$(az_retry az keyvault list -g rg-webprojectazureprefix \
            --query "[?tags.environment=='production'].name" -o tsv)
          CONN=$(az_retry az keyvault secret show \
            --vault-name "${KV}" --name sql-connection-string \
            --query value -o tsv)
          echo "::add-mask::${CONN}"
          ASPNETCORE_ENVIRONMENT=Production \
          ConnectionStrings__DefaultConnection="${CONN}" \
          dotnet ./migration/WebProject.MigrationService.dll

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Migrate production database" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Migrate production database failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Key Vault throttled**: too many requests — re-run the job" >> $GITHUB_STEP_SUMMARY
            echo "- **Migration failure** — check if migration is safe to re-run (EF migrations are idempotent by default)" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-prod:
    name: Deploy to production
    needs: migrate-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./api

      - uses: actions/download-artifact@v4
        with:
          name: web-prod
          path: ./web

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get production SWA URL
        id: swa_url
        run: |
          SWA_HOSTNAME=$(az staticwebapp show \
            --name swa-webprojectazureprefix --resource-group rg-webprojectazureprefix \
            --query defaultHostname -o tsv)
          echo "url=https://${SWA_HOSTNAME}" >> $GITHUB_OUTPUT

      # ── CONFIGURE: Choose your App Service deployment arrangement ────────────
      #
      # Pick ONE option and delete the other. Your choice must match the staging
      # deploy step in staging.appservice.yml (staging and production should mirror).
      #
      # OPTION A — Deployment slot
      #   Deploy the new API to the staging slot, then swap it into production.
      #   Required App Service config: deployment slots enabled, slot named 'staging'.
      #
      # OPTION B — Direct deploy
      #   Deploy the new API directly to the production App Service.
      #   No slot swap. Simpler but causes a brief restart during deploy.
      #
      # ────────────────────────────────────────────────────────────────────────

      # OPTION A — Pre-swap: update CORS on staging slot and deploy API
      - name: Set CORS on staging slot to production SWA URL
        run: |
          # Non-sticky app settings travel with the slot during a swap.
          # Update CORS to the production URL before swapping so the correct
          # value lands in the production slot without requiring a post-swap restart.
          for i in {1..6}; do
            az webapp config appsettings set \
              --resource-group rg-webprojectazureprefix \
              --name app-webprojectazureprefix-api \
              --slot staging \
              --settings "Cors__AllowedOrigins=${{ steps.swa_url.outputs.url }}" \
              --output none && exit 0
            echo "Attempt $i/6 failed (slot busy) — retrying in 15s..."
            sleep 15
          done
          exit 1

      # OPTION A — Deploy new API to staging slot before swap
      - name: Deploy API → staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-webprojectazureprefix-api
          slot-name: staging
          package: ./api

      # OPTION A — Wait for the staging slot to be healthy before swap
      - name: Wait for staging slot to be healthy
        run: |
          for i in {1..12}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              https://app-webprojectazureprefix-api-staging.azurewebsites.net/health || echo "000")
            echo "Attempt $i/12 — HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "Staging slot is healthy — proceeding with swap"
              exit 0
            fi
            sleep 10
          done
          echo "Staging slot failed health check before swap"
          exit 1

      # OPTION A — Swap staging slot into production
      - name: Swap API staging → production
        run: |
          # Run synchronously — the command blocks until Azure confirms the swap
          # succeeded or fails with a non-zero exit code. Do not use `timeout` here:
          # a CLI timeout causes the swap to continue in Azure while the workflow
          # moves on, and the subsequent health check then sees HTTP 200 from the
          # *old* production slot still serving traffic, producing a false positive.
          az webapp deployment slot swap \
            --resource-group rg-webprojectazureprefix \
            --name app-webprojectazureprefix-api \
            --slot staging \
            --target-slot production

          echo "Swap complete — verifying production health..."
          for i in {1..12}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              https://app-webprojectazureprefix-api.azurewebsites.net/health || echo "000")
            echo "Attempt $i/12 — HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "Production is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Production health check failed after swap"
          exit 1

      # OPTION B — Deploy API directly to production (uncomment to use; delete Options A above)
      # - name: Deploy API → production App Service
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: app-webprojectazureprefix-api
      #     package: ./api
      #
      # - name: Set CORS on production App Service
      #   run: |
      #     az webapp config appsettings set \
      #       --resource-group rg-webprojectazureprefix \
      #       --name app-webprojectazureprefix-api \
      #       --settings "Cors__AllowedOrigins=${{ steps.swa_url.outputs.url }}" \
      #       --output none

      - name: Get SWA deployment token
        run: |
          az_retry() {
            local n=1 max=5 delay=15
            until "$@"; do
              (( n++ >= max )) && { echo "ERROR: command failed after $((max)) attempts: $*" >&2; return 1; }
              echo "Attempt $((n-1))/$((max-1)) failed — retrying in ${delay}s..."
              sleep $delay
            done
          }
          TOKEN=$(az_retry az staticwebapp secrets list \
            --name swa-webprojectazureprefix --resource-group rg-webprojectazureprefix \
            --query properties.apiKey -o tsv)
          echo "::add-mask::${TOKEN}"
          echo "SWA_TOKEN=${TOKEN}" >> $GITHUB_ENV

      - name: Deploy frontend → SWA production
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: ./web
          skip_app_build: true
          # No deployment_environment = production

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Deploy to production" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deploy to production failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Slot 409 Conflict**: slot is still processing a previous operation — the retry loop should handle this; if it persists, check Azure portal for stuck operations" >> $GITHUB_STEP_SUMMARY
            echo "- **AppConfig unavailable**: transient Azure outage — re-run the job" >> $GITHUB_STEP_SUMMARY
            echo "- **Key Vault throttled**: too many requests — re-run the job" >> $GITHUB_STEP_SUMMARY
            echo "- **Swap health check failed**: check staging slot logs at https://portal.azure.com" >> $GITHUB_STEP_SUMMARY
          fi
